name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q QQMailCodeAssistant-v1.4.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleRelease --no-daemon
        working-directory: QQMailCodeAssistant
      - uses: actions/upload-artifact@v4
        with:
          name: QQMailCodeAssistant
          path: QQMailCodeAssistant/app/build/outputs/apk/release/*.apk
